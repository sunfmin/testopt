[package]
name = "testopt"
version = "0.1.0"
edition = "2024"
description = "Find where a cargo-nextest suite's time goes, and check a faster suite kept its coverage"
license = "MIT"

[workspace]
exclude = ["tests/fixture"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
libc = "0.2"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
