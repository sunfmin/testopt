name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain testopt is developed on: nightly, for branch coverage.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-22
          components: clippy, llvm-tools, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.9.1
      - name: tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y tmux; else brew install tmux; fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --no-fail-fast
